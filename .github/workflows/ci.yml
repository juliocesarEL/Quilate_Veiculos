name: CI

# O token automático do GitHub só lê o repositório (nada de escrita)
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# Um novo push na mesma branch cancela a execução anterior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

