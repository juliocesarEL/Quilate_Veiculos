name: CI/CD

# O token automático do GitHub só lê o repositório (nada de escrita)
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# Um novo push na mesma branch cancela a execução anterior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy de produção (Vercel)
    needs: ci # só publica se o CI passou
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Aviso se os segredos não estiverem configurados
        if: env.VERCEL_TOKEN == ''
        run: echo "::warning::VERCEL_TOKEN não configurado. Veja a seção CI/CD do README."

      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 22
          cache: npm

      - name: Baixar configuração do projeto na Vercel
        if: env.VERCEL_TOKEN != ''
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        if: env.VERCEL_TOKEN != ''
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Publicar
        if: env.VERCEL_TOKEN != ''
        run: npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
